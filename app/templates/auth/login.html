{% extends "base.html" %}

{% block title %}Sign In — AVYRO{% endblock %}

{% block content %}

<div class="container py-5 my-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-lg radius-xl p-4 p-md-5 bg-white border border-warning">
        <div class="text-center mb-4">
          <a class="navy-logo fs-1 mb-2 d-inline-block" href="{{ url_for('shop.home') }}">
            AVYRO<span>.</span>
          </a>
          <h3 class="font-serif fw-bold text-dark">Welcome Back</h3>
          <p class="text-muted small">Sign in to manage your orders, wishlist & client profile.</p>
        </div>

        <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST">
          <div class="mb-3">
            <label class="form-label small fw-semibold text-muted">Email Address</label>
            <input type="email" name="email" class="form-control form-control-lg radius-md" placeholder="user@domain.com" required autofocus>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <label class="form-label small fw-semibold text-muted mb-0">Password</label>
              <a href="#" class="extra-small text-primary" onclick="alert('Demo notice: Default password for demo user is User@123')">Forgot?</a>
            </div>
            <input type="password" name="password" class="form-control form-control-lg radius-md mt-1" placeholder="••••••••" required>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" name="remember" id="rememberCheck" checked>
            <label class="form-check-label small text-muted" for="rememberCheck">Keep me signed in</label>
          </div>

          <button type="submit" class="btn btn-avyro btn-avyro-maroon w-100 py-3 font-serif fw-bold mb-3">
            SIGN IN &rarr;
          </button>

          <p class="text-center text-muted small mb-0">
            Don't have an AVYRO account? <a href="{{ url_for('auth.register') }}" class="fw-bold text-primary font-serif">Create Account</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
