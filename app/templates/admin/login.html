<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login — AVYRO</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center min-vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-lg radius-xl p-4 p-md-5 bg-white text-dark border border-warning">
          <div class="text-center mb-4">
            <a class="navy-logo fs-2 mb-2 d-inline-block" href="#">
              AVYRO<span>.</span> ADMIN
            </a>
            <h4 class="font-serif fw-bold text-dark">Admin Access Portal</h4>
            <p class="text-muted small">Authorized Personnel Only</p>
          </div>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show radius-md small" role="alert">
                  {{ message }}
                  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form action="{{ url_for('admin.login') }}" method="POST">
            <div class="mb-3">
              <label class="form-label small fw-semibold text-muted">Admin Email</label>
              <input type="email" name="email" class="form-control radius-md" placeholder="admin@avyro.com" required autofocus>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-semibold text-muted">Password</label>
              <input type="password" name="password" class="form-control radius-md" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-avyro btn-avyro-maroon w-100 py-3 font-serif fw-bold mb-3">
              ACCESS CONTROL DASHBOARD &rarr;
            </button>

            <a href="{{ url_for('shop.home') }}" class="d-block text-center text-muted small">&larr; Return to Public Website</a>
          </form>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
